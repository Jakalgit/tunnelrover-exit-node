# Reference copy. deploy.sh renders templates/docker-compose.yaml.template
# into generated/docker-compose.yaml and does not modify this file.
services:
  xray:
    image: teddysun/xray:latest
    container_name: xray-exit
    restart: unless-stopped
    volumes:
      - ./config.json:/etc/xray/config.json:ro
    ports:
      - "443:443"