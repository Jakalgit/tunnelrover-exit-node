# Reference copy. deploy.sh renders templates/hysteria-config.yaml.template
# from deploy/nodes.json into generated/hysteria-config.yaml and does not modify this file.

listen: :443

tls:
  cert: /etc/hysteria/certs/fullchain.pem
  key: /etc/hysteria/certs/privkey.pem

auth:
  type: password
  password: "REPLACE_RELAY_UUID"

masquerade:
  type: proxy
  proxy:
    url: https://www.cloudflare.com

bandwidth:
  up: 1 gbps
  down: 1 gbps
